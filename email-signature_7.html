      Outlook menu > Settings > Signatures)
  3. Paste as rich text, not plain text, so the layout and images work

  Note: rounded corners (border-radius) render in Gmail, Outlook Web,
  and Outlook on Mac, but classic Outlook for Windows uses Word's
  rendering engine and will show square corners instead. Everything
  else displays the same everywhere.
-->
