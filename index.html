<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Griffin Miller — Go Garage Doors</title>
<style>
  :root{
    --ink:#1C2023;
    --steel:#4A5057;
    --concrete:#ECE8E1;
    --orange:#E2572B;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--concrete);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--white);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 20px 50px -20px rgba(28,32,35,0.35);
  }

  /* Door panel reveal */
  .door{
    position:relative;
    height:96px;
    background:var(--ink);
    overflow:hidden;
  }
  .slat{
    position:absolute;
    left:0; right:0;
    height:16px;
    background:var(--steel);
    border-top:1px solid rgba(255,255,255,0.08);
    border-bottom:1px solid rgba(0,0,0,0.25);
  }
  .slat:nth-child(1){ top:0; }
  .slat:nth-child(2){ top:16px; }
  .slat:nth-child(3){ top:32px; }
  .slat:nth-child(4){ top:48px; }
  .slat:nth-child(5){ top:64px; }
  .slat:nth-child(6){ top:80px; }

  .door-mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .door-mark span{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:600;
    letter-spacing:0.18em;
    font-size:13px;
    color:var(--orange);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: no-preference){
    .slat{ animation:rollUp 0.9s cubic-bezier(.4,0,.2,1) forwards; }
    .slat:nth-child(1){ animation-delay:0.30s; }
    .slat:nth-child(2){ animation-delay:0.24s; }
    .slat:nth-child(3){ animation-delay:0.18s; }
    .slat:nth-child(4){ animation-delay:0.12s; }
    .slat:nth-child(5){ animation-delay:0.06s; }
    .slat:nth-child(6){ animation-delay:0s; }
    @keyframes rollUp{
      to{ transform:translateY(-120px); opacity:0; }
    }
    .door-mark{ opacity:0; animation:fadeIn 0.6s ease forwards; animation-delay:0.7s; }
    @keyframes fadeIn{ to{ opacity:1; } }
  }

  @media (prefers-reduced-motion: reduce){
    .slat{ display:none; }
  }

  .content{
    padding:32px 28px 28px;
  }

  .eyebrow{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--orange);
    font-weight:600;
    margin-bottom:10px;
  }

  h1{
    font-family:'Oswald', 'Arial Narrow', sans-serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.01em;
    color:var(--ink);
    line-height:1.1;
  }

  .role{
    margin-top:4px;
    font-size:15px;
    color:var(--steel);
    font-weight:500;
  }

  .company{
    font-size:15px;
    color:var(--steel);
  }

  .track{
    margin:22px 0;
    height:1px;
    background-image:linear-gradient(to right, var(--steel) 0, var(--steel) 6px, transparent 6px, transparent 12px);
    background-size:12px 1px;
    opacity:0.4;
  }

  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    font-size:15px;
    color:var(--ink);
    text-decoration:none;
  }
  .row .icon{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--concrete);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .row .icon svg{ width:16px; height:16px; }

  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:24px;
    padding:15px 20px;
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:3px;
    font-family:'Oswald','Arial Narrow',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .save-btn:hover{ background:#C8481F; }
  .save-btn:active{ transform:translateY(1px); }
  .save-btn:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }
  .save-btn svg{ width:16px; height:16px; }

  .footer-note{
    margin-top:16px;
    text-align:center;
    font-size:12px;
    color:var(--steel);
    opacity:0.75;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="door">

      <div class="slat"></div>
      <div class="slat"></div>
      <div class="slat"></div>
      <div class="slat"></div>
      <div class="slat"></div>

        </span>
        727-433-3449

        Save Contact

    </div>

</body>
</html>
